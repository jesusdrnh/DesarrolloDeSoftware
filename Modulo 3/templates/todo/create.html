{% extends 'base.html' %}

{% block title %}Nueva Tarea{% endblock %}

{% block content %}
<section class="form-section">
    <h2>Crear Nueva Tarea</h2>
    
    <form method="POST" action="{{ url_for('create_task') }}">
        <div class="form-group">
            <label for="title">Título *</label>
            <input type="text" id="title" name="title" class="form-control" value="{{ request.form.title }}" required>
            {% if errors and errors.title %}
                <div class="error-message">{{ errors.title[0] }}</div>
            {% endif %}
        </div>
        
        <div class="form-group">
            <label for="description">Descripción</label>
            <textarea id="description" name="description" class="form-control" rows="3">{{ request.form.description }}</textarea>
        </div>
        
        <div class="form-group">
            <label for="priority">Prioridad</label>
            <select id="priority" name="priority" class="form-control">
                <option value="1" {% if request.form.priority == '1' %}selected{% endif %}>Baja</option>
                <option value="2" {% if request.form.priority == '2' %}selected{% endif %}>Media</option>
                <option value="3" {% if request.form.priority == '3' %}selected{% endif %}>Alta</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="due_date">Fecha de vencimiento</label>
            <input type="date" id="due_date" name="due_date" class="form-control" value="{{ request.form.due_date }}">
        </div>
        
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Guardar Tarea</button>
            <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</section>
{% endblock %}
