{% extends 'base.html' %}

{% block title %}Editar Tarea{% endblock %}

{% block content %}
<section class="form-section">
    <h2>Editar Tarea</h2>
    
    <form method="POST" action="{{ url_for('edit_task', task_id=task.id) }}">
        <div class="form-group">
            <label for="title">Título *</label>
            <input type="text" id="title" name="title" class="form-control" value="{{ task.title }}" required>
            {% if errors and errors.title %}
                <div class="error-message">{{ errors.title[0] }}</div>
            {% endif %}
        </div>
        
        <div class="form-group">
            <label for="description">Descripción</label>
            <textarea id="description" name="description" class="form-control" rows="3">{{ task.description }}</textarea>
        </div>
        
        <div class="form-group">
            <label for="priority">Prioridad</label>
            <select id="priority" name="priority" class="form-control">
                <option value="1" {% if task.priority == 1 %}selected{% endif %}>Baja</option>
                <option value="2" {% if task.priority == 2 %}selected{% endif %}>Media</option>
                <option value="3" {% if task.priority == 3 %}selected{% endif %}>Alta</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="due_date">Fecha de vencimiento</label>
            <input type="date" id="due_date" name="due_date" class="form-control" value="{{ task.due_date.strftime('%Y-%m-%d') if task.due_date else '' }}">
        </div>
        
        <div class="form-group">
            <label class="checkbox-container">
                <input type="checkbox" id="done" name="done" {% if task.done %}checked{% endif %}>
                <span class="checkmark"></span>
                Tarea completada
            </label>
        </div>
        
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Actualizar Tarea</button>
            <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</section>
{% endblock %}
